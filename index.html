<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="個人任務與事件儀表板" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>任務儀表板</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --line: #d9dce1;
        --text: #1c1e21;
        --muted: #6b7280;
        --accent: #2563eb;
        --accent-soft: #e8effc;
        --danger: #b91c1c;
        --warn-bg: #fef3c7;
        --warn-border: #fcd34d;
        --warn-text: #92400e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', sans-serif;
        line-height: 1.6;
        background: var(--bg);
        color: var(--text);
      }
      /* 全頁視圖（login / blocked / error）置中 */
      main.center {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      main.center .panel {
        width: min(100%, 22rem);
        text-align: center;
      }
      main.center h1 {
        margin: 0 0 0.25rem;
        font-size: 1.3rem;
      }
      main.center .muted {
        color: var(--muted);
        margin: 0 0 1rem;
      }
      .notice {
        color: var(--warn-text);
        font-size: 0.9rem;
        margin: 0 0 0.75rem;
      }
      .error-detail {
        color: var(--muted);
        font-size: 0.78rem;
        margin: 0 0 1rem;
        overflow-wrap: anywhere;
      }
      /* ready 版面：desktop 兩欄（任務｜事件），手機單欄 */
      main.layout {
        max-width: 64rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
      }
      .topbar {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 0.75rem;
      }
      .topbar h1 {
        font-size: 1.25rem;
        margin: 0;
      }
      .today {
        color: var(--muted);
      }
      .cycle {
        background: var(--accent-soft);
        color: var(--accent);
        border-radius: 999px;
        padding: 0.1rem 0.6rem;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .warning-bar {
        background: var(--warn-bg);
        color: var(--warn-text);
        border: 1px solid var(--warn-border);
        border-radius: 8px;
        padding: 0.5rem 0.75rem;
        margin-bottom: 0.75rem;
        font-size: 0.9rem;
      }
      .warning-bar p {
        margin: 0.15rem 0;
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        gap: 1rem;
        align-items: start;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem;
      }
      .panel h2 {
        margin: 0;
        font-size: 1.05rem;
      }
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .add-row {
        display: flex;
        gap: 0.5rem;
        margin: 0.5rem 0 0.75rem;
      }
      .add-row input {
        flex: 1;
        min-width: 0;
      }
      input,
      textarea,
      select {
        font: inherit;
        padding: 0.4rem 0.5rem;
        border: 1px solid #b9bec6;
        border-radius: 6px;
        background: #fff;
        color: inherit;
      }
      textarea {
        resize: vertical;
      }
      .btn {
        font: inherit;
        font-weight: 600;
        padding: 0.45rem 0.9rem;
        border: none;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .btn.ghost {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--line);
      }
      .btn.danger {
        background: var(--danger);
        color: #fff;
      }
      .btn.danger-ghost {
        background: transparent;
        color: var(--danger);
        border: 1px solid #f3c1c1;
      }
      .btn.small {
        padding: 0.2rem 0.6rem;
        font-size: 0.85rem;
      }
      /* 任務區 */
      .task-list,
      .event-list,
      .manage-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .task-row {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.55rem 0.75rem;
        cursor: pointer;
      }
      .task-row.expanded {
        border-color: var(--accent);
      }
      .task-main {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .task-title {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .task-meta {
        display: flex;
        gap: 0.35rem;
        align-items: center;
        font-size: 0.8rem;
        color: var(--muted);
        flex-shrink: 0;
      }
      .badge {
        border-radius: 999px;
        padding: 0 0.5rem;
        font-size: 0.75rem;
      }
      .badge.park {
        background: #fde68a;
        color: var(--warn-text);
      }
      .prio-critical {
        color: var(--danger);
        font-weight: 700;
      }
      .prio-high {
        color: #c2410c;
      }
      .prio-medium,
      .prio-low {
        color: var(--muted);
      }
      .check {
        width: 1.4rem;
        height: 1.4rem;
        border-radius: 6px;
        border: 1.5px solid #9ca3af;
        background: #fff;
        color: var(--accent);
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
        flex-shrink: 0;
        padding: 0;
      }
      .task-row.done .check {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      /* 完成項：變灰 + 刪除線（位置排最後由排序邏輯負責） */
      .task-row.done .task-title {
        color: #9ca3af;
        text-decoration: line-through;
      }
      .task-row.done .task-meta {
        color: #c3c8cf;
      }
      .task-detail {
        margin-top: 0.6rem;
        padding-top: 0.6rem;
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        cursor: default;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .field input,
      .field select,
      .field textarea {
        font-size: 0.95rem;
        color: var(--text);
      }
      .field-row {
        display: flex;
        gap: 0.6rem;
      }
      .field-row .field {
        flex: 1;
        min-width: 0;
      }
      .notes {
        width: 100%;
        min-height: 3rem;
        overflow: hidden;
      }
      /* tag chips：已選置前（排序邏輯）＋ 高亮；無 × 圖示 */
      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        align-items: center;
      }
      .tag-chip {
        font: inherit;
        font-size: 0.8rem;
        padding: 0.15rem 0.6rem;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #f3f4f6;
        color: var(--text);
        cursor: pointer;
      }
      .tag-chip.selected {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 700;
      }
      .tag-chip.add {
        border-style: dashed;
        color: var(--muted);
        background: transparent;
      }
      #new-tag-input {
        width: 11rem;
        padding: 0.15rem 0.5rem;
        font-size: 0.8rem;
      }
      .detail-actions {
        display: flex;
        justify-content: flex-end;
      }
      /* 事件區 */
      .event-group + .event-group {
        margin-top: 1rem;
      }
      .group-title {
        margin: 0 0 0.4rem;
        font-size: 0.95rem;
      }
      .group-sub {
        margin: 0.6rem 0 0.3rem;
        font-size: 0.85rem;
        color: var(--muted);
        font-weight: 600;
      }
      .event-row {
        display: flex;
        gap: 0.5rem;
        align-items: baseline;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0.45rem 0.6rem;
        font-size: 0.92rem;
      }
      .ev-icon {
        flex-shrink: 0;
      }
      .ev-time {
        color: var(--muted);
        font-size: 0.82rem;
        flex-shrink: 0;
        min-width: 6.5rem;
      }
      .ev-title {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .event-row.past {
        color: #9ca3af;
        opacity: 0.75;
      }
      .event-row.allday .ev-time {
        color: var(--text);
        font-weight: 600;
      }
      /* 空狀態 */
      .empty {
        margin: 0.25rem 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      /* tag 目錄管理面板 */
      .manage-panel {
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 0.6rem;
        margin-bottom: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .manage-list .manage-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .manage-name {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .manage-count {
        color: var(--muted);
        font-size: 0.8rem;
        flex-shrink: 0;
      }
      /* toast */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 1.25rem;
        transform: translateX(-50%);
        background: #1f2937;
        color: #fff;
        padding: 0.5rem 0.9rem;
        border-radius: 8px;
        font-size: 0.9rem;
        z-index: 50;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        max-width: min(90vw, 30rem);
      }
      /* 確認對話框 */
      dialog {
        border: none;
        border-radius: 10px;
        padding: 0;
        max-width: 22rem;
        width: calc(100vw - 2rem);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      }
      dialog::backdrop {
        background: rgba(15, 23, 42, 0.45);
      }
      dialog form {
        padding: 1rem 1.1rem;
      }
      dialog p {
        margin: 0 0 1rem;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
      }
      /* 骨架屏（靜態標記，首個 render 取代） */
      .skeleton-screen {
        max-width: 64rem;
        margin: 0 auto;
        padding: 1.5rem 1rem 3rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .skeleton {
        border-radius: 10px;
        background: linear-gradient(100deg, #e7e9ee 40%, #f3f4f6 50%, #e7e9ee 60%);
        background-size: 200% 100%;
        animation: shimmer 1.4s linear infinite;
      }
      .skeleton-bar {
        height: 2.2rem;
        width: 60%;
      }
      .skeleton-cols {
        display: grid;
        grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
        gap: 1rem;
      }
      .skeleton-panel {
        height: 18rem;
      }
      @keyframes shimmer {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .skeleton {
          animation: none;
        }
      }
      /* 手機：單欄 */
      @media (max-width: 30rem) {
        .columns,
        .skeleton-cols {
          grid-template-columns: 1fr;
        }
        main.layout {
          padding: 1rem 0.75rem 2rem;
        }
        .panel {
          padding: 0.75rem;
        }
        .field-row {
          flex-direction: column;
        }
        .ev-time {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- 靜態骨架屏：頂欄／任務／事件三塊 shimmer，首個 render 取代 -->
      <div class="skeleton-screen" aria-hidden="true">
        <div class="skeleton skeleton-bar"></div>
        <div class="skeleton-cols">
          <div class="skeleton skeleton-panel"></div>
          <div class="skeleton skeleton-panel"></div>
        </div>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <p id="confirm-text"></p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="btn ghost">取消</button>
          <button type="submit" value="ok" class="btn danger">確認</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
